[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comp0035-air-passenger-departures"
version = "0.1.0"
description = "COMP0035 Coursework 1 - Air passenger data"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "pandas>=2.2",
  "matplotlib>=3.8"
]

[tool.setuptools.packages.find]
where = ["src"]
